name: Publicar release

on:
  push:
    # One release tag per version: this branch only publishes v2.8.4-pre-alpha.
    tags:
      - 'v2.8.4-pre-alpha'

permissions:
  contents: write

jobs:
  build-and-release:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.13'

      - name: Preparar Gradle
        # v5 is the last MIT-licensed major; v6 bundles a proprietary caching component.
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar JAR de release
        # Builds the Forge and Fabric JARs and merges them with Forgix into build/libs/.
        run: ./gradlew --no-daemon mergeJars -PmodVersion="${GITHUB_REF_NAME#v}"

      - name: Calcular cobertura de clases decompiladas
        id: decompilation-match
        run: python3 scripts/calculate_decompilation_match.py --built-jar 'build/libs/luxium-*.jar' --map build/decompilation-map.svg

      - name: Generar imagen del mapa de decompilación
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin
          rsvg-convert --zoom 2 --output build/decompilation-map.png build/decompilation-map.svg

      - name: Crear GitHub Release y adjuntar JAR
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Decompiled source coverage

            ![Decompilation map](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decompilation-map.png)

            *Each cell is one method (left) or one class file (right), grouped by loader copy (`forge/`, `fabric/`) and package. Green cells match the original JAR; grey cells do not.*

            **${{ steps.decompilation-match.outputs.class_percentage }}%** — ${{ steps.decompilation-match.outputs.class_identical }} of ${{ steps.decompilation-match.outputs.class_total }} `.class` files of the original JAR (Forge and Fabric copies) are byte-identical in this release.

            **${{ steps.decompilation-match.outputs.bytecode_percentage }}%** — ${{ steps.decompilation-match.outputs.bytecode_identical }} of ${{ steps.decompilation-match.outputs.bytecode_total }} methods of the original JAR compile to identical bytecode in this release.

            **${{ steps.decompilation-match.outputs.percentage }}%** — ${{ steps.decompilation-match.outputs.matched }} of ${{ steps.decompilation-match.outputs.total }} top-level classes from the original mod JAR have corresponding Java source files in this decompilation with no methods left undecompiled (${{ steps.decompilation-match.outputs.failed_methods }} methods failed to decompile).

            *Methods are compared instruction by instruction, ignoring constant pool indices, branch offsets and lambda numbering. Class files are compared byte for byte. Only the packaging of the JAR differs from the original (manifest, timestamps, entry order, line endings of some text resources).*

            ## Source

            Built from the [`2.8.4-pre-alpha`](https://github.com/${{ github.repository }}/tree/2.8.4-pre-alpha) branch at commit `${{ github.sha }}`.

            ## Credits

            Based on **Luxium: Let there be light** by **Vinlanx** — https://www.curseforge.com/minecraft/mc-mods/luxium

            All original code, shaders, assets, and branding are Copyright © Vinlanx and are distributed under the Luxium Custom License (`LICENSE.txt`). This is an unofficial decompilation and is not affiliated with or endorsed by the original author.

            ## Requirements

            One JAR for both loaders. Minecraft 1.20.1, Java 17.

            - **Forge:** Forge 47.1.3 or newer, and Embeddium `0.3.31+mc1.20.1` or a later 0.3.x (mandatory; 0.4.x is not compatible).
            - **Fabric:** Fabric Loader 0.16.14 or newer, Fabric API `0.92.2+1.20.1` or newer, and Sodium `0.5.13` exactly (mandatory). night-config is bundled.
            - Not compatible with Oculus (Forge), Iris (Fabric), or OptiFine.

            ## Takedown

            This is an unofficial decompilation and is not affiliated with the original author. If you are the rights holder and want this release removed, contact **berramuspegonzalez@gmail.com** and it will be honored promptly.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/libs/luxium-*.jar
            build/decompilation-map.png
            build/decompilation-map.svg
