name: Publicar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calcular cobertura de clases decompiladas
        id: decompilation-match
        run: python3 scripts/calculate_decompilation_match.py

      - name: Compilar JAR de release
        run: ./gradlew --no-daemon clean build -PmodVersion="${GITHUB_REF_NAME#v}"

      - name: Crear GitHub Release y adjuntar JAR
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Decompiled source coverage

            **${{ steps.decompilation-match.outputs.percentage }}%** — ${{ steps.decompilation-match.outputs.matched }} of ${{ steps.decompilation-match.outputs.total }} top-level classes from the original mod JAR have corresponding Java source files in this decompilation.

            *This measures class-name/source-file coverage; it does not compare source-code or bytecode similarity.*
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/libs/luxium-*.jar
