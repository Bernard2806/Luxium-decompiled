name: Publicar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar JAR de release
        run: ./gradlew --no-daemon clean build -PmodVersion="${GITHUB_REF_NAME#v}"

      - name: Calcular cobertura de clases decompiladas
        id: decompilation-match
        run: python3 scripts/calculate_decompilation_match.py --built-jar 'build/libs/luxium-*.jar' --map build/decompilation-map.svg

      - name: Generar imagen del mapa de decompilación
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin
          rsvg-convert --zoom 2 --output build/decompilation-map.png build/decompilation-map.svg

      - name: Crear GitHub Release y adjuntar JAR
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Decompiled source coverage

            ![Decompilation map](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decompilation-map.png)

            *Each cell is one method (left) or one class (right), grouped by package. Green cells match the original JAR; grey cells do not.*

            **${{ steps.decompilation-match.outputs.percentage }}%** — ${{ steps.decompilation-match.outputs.matched }} of ${{ steps.decompilation-match.outputs.total }} top-level classes from the original mod JAR have corresponding Java source files in this decompilation with no methods left undecompiled (${{ steps.decompilation-match.outputs.failed_methods }} methods failed to decompile).

            **${{ steps.decompilation-match.outputs.bytecode_percentage }}%** — ${{ steps.decompilation-match.outputs.bytecode_identical }} of ${{ steps.decompilation-match.outputs.bytecode_total }} methods of the original JAR compile to identical bytecode in this release.

            *Bytecode is compared instruction by instruction, ignoring constant pool indices, branch offsets and lambda numbering. Methods that differ may still behave the same.*

            ## Credits

            Based on **Luxium: Let there be light** by **Vinlanx** — https://www.curseforge.com/minecraft/mc-mods/luxium

            All original code, shaders, assets, and branding are Copyright © Vinlanx and are distributed under the Luxium Custom License (`LICENSE.txt`). This is an unofficial decompilation and is not affiliated with or endorsed by the original author.

            ## Requirements

            - Minecraft 1.20.1, Forge 47.1.3 or newer (tested with 47.4.10).
            - Embeddium `0.3.31+mc1.20.1` (mandatory).
            - Not compatible with Oculus/OptiFine.

            ## Takedown

            This is an unofficial decompilation and is not affiliated with the original author. If you are the rights holder and want this release removed, contact **berramuspegonzalez@gmail.com** and it will be honored promptly.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/libs/luxium-*.jar
            build/decompilation-map.png
            build/decompilation-map.svg
